# React Static Site and single-worker FastAPI service.
# Configure the frontend and API origins after Render assigns their URLs.
services:
  - type: web
    name: odos-api
    runtime: python
    plan: free
    buildCommand: pip install --only-binary=:all: -r requirements-planner.txt && python scripts/check-deployment-data.py
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: PLANNER_TIMEOUT_SECONDS
        value: "300"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: GDAL_CACHEMAX
        value: "16"
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: web
    name: odos
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
